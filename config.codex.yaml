project:
  name: "my-research-codex"
  mode: "full-auto"

research:
  topic: "Your research topic here"
  domains:
    - "machine-learning"
  daily_paper_count: 10
  quality_threshold: 4.0

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 3
  approval_timeout_hours: 12
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "acp"
  base_url: ""
  wire_api: "chat_completions"
  api_key_env: ""
  api_key: ""
  primary_model: ""
  fallback_models: []
  acp:
    agent: "codex"
    cwd: "/Users/yangyiqun/codex_work/AutoResearchClaw"
    acpx_command: "/Users/yangyiqun/codex_work/AutoResearchClaw/.tools/acpx/node_modules/.bin/acpx"
    session_name: "researchclaw-codex"
    timeout_sec: 1800

security:
  hitl_required_stages: [5, 9, 20]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 300
  max_iterations: 10
  metric_key: "primary_metric"
  metric_direction: "minimize"
  sandbox:
    python_path: "/Users/yangyiqun/codex_work/AutoResearchClaw/.venv/bin/python3"
    gpu_required: false
    max_memory_mb: 4096
  opencode:
    enabled: false
  repair:
    enabled: true
    use_opencode: false
  code_agent:
    enabled: true
    architecture_planning: true
    sequential_generation: true
    hard_validation: true
    hard_validation_max_repairs: 4
    exec_fix_max_iterations: 3
    exec_fix_timeout_sec: 60
    tree_search_enabled: false
    review_max_rounds: 0
  cli_agent:
    provider: "llm"
    binary_path: ""
    model: ""
    max_budget_usd: 5.0
    timeout_sec: 600
    extra_args: []
  figure_agent:
    enabled: true
    output_format: "python"
    nano_banana_enabled: false

prompts:
  custom_file: ""

metaclaw_bridge:
  enabled: false
